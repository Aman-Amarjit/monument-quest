openapi: 3.0.3
info:
  title: MonumentQuest API
  version: 3.0.0
  description: Heritage discovery, social feed, and gamification API.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: api.example.com
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Monuments
  - name: Feed
  - name: Social
  - name: AI
paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: API status
      responses:
        '200':
          description: Service is online
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Create an explorer account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in an explorer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/guest:
    post:
      tags: [Auth]
      security: []
      summary: Create a guest explorer
      responses:
        '201': { $ref: '#/components/responses/AuthResponse' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current explorer profile
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /monuments:
    get:
      tags: [Monuments]
      security: []
      summary: List monuments using cursor pagination
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
  /monuments/nearby:
    get:
      tags: [Monuments]
      security: []
      summary: Find monuments near a coordinate
      parameters:
        - { $ref: '#/components/parameters/Latitude' }
        - { $ref: '#/components/parameters/Longitude' }
        - name: radiusMeters
          in: query
          schema: { type: number, minimum: 100, maximum: 100000, default: 50000 }
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /monuments/{id}:
    get:
      tags: [Monuments]
      security: []
      summary: Get one monument
      parameters: [{ $ref: '#/components/parameters/MonumentId' }]
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
  /monuments/capture:
    post:
      tags: [Monuments]
      summary: Capture a monument from a nearby coordinate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureRequest' }
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /feed:
    get:
      tags: [Feed]
      security: []
      summary: Read the social feed
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
  /feed/posts:
    post:
      tags: [Feed]
      summary: Publish a monument post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostRequest' }
      responses:
        '201': { $ref: '#/components/responses/GenericSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /feed/posts/{id}/like:
    post:
      tags: [Feed]
      summary: Toggle a post like
      parameters: [{ $ref: '#/components/parameters/PostId' }]
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /feed/posts/{id}/comments:
    get:
      tags: [Feed]
      security: []
      summary: Read comments for a post
      parameters: [{ $ref: '#/components/parameters/PostId' }]
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Feed]
      summary: Add a comment to a post
      parameters: [{ $ref: '#/components/parameters/PostId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201': { $ref: '#/components/responses/GenericSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /leaderboard:
    get:
      tags: [Social]
      security: []
      summary: Read explorer rankings
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
  /guilds:
    get:
      tags: [Social]
      security: []
      summary: List regional guilds
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
  /ai/narrator:
    post:
      tags: [AI]
      summary: Ask a monument narrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monumentName, message]
              properties:
                monumentName: { type: string, maxLength: 120 }
                message: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /ai/verify-reflection:
    post:
      tags: [AI]
      summary: Verify a historical reflection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monumentName, content]
              properties:
                monumentName: { type: string, maxLength: 120 }
                content: { type: string, maxLength: 5000 }
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MonumentId: { name: id, in: path, required: true, schema: { type: string } }
    PostId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Latitude: { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
    Longitude: { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128, format: password }
        name: { type: string, minLength: 2, maxLength: 80 }
        guildName: { type: string, maxLength: 80 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    CaptureRequest:
      type: object
      required: [latitude, longitude]
      properties:
        monumentId: { type: string }
        name: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        imageUrl: { type: string, format: uri, maxLength: 2048 }
    PostRequest:
      type: object
      required: [monumentId, caption]
      properties:
        monumentId: { type: string }
        caption: { type: string, minLength: 1, maxLength: 500 }
        imageUrl: { type: string, format: uri, maxLength: 2048 }
        postType: { type: string, maxLength: 40 }
    SuccessResponse:
      type: object
      properties:
        status: { type: string }
        service: { type: string }
        version: { type: string }
    GenericResponse:
      type: object
      properties:
        success: { type: boolean }
        data: {}
        error: { type: string }
        requestId: { type: string }
    GenericSuccess:
      description: Successful API response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericResponse' }
  responses:
    GenericSuccess:
      description: Successful API response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericResponse' }
    AuthResponse:
      description: Token and explorer profile
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericResponse' }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericResponse' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericResponse' }
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericResponse' }
